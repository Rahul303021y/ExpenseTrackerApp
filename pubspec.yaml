name: expensetrackerapp
description: "A Expense Tracker App using Flutter."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.6.0
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  lottie: ^3.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  fonts:
    - family: Inter
      fonts:
        - asset: asset/fonts/Inter/Inter-VariableFont_opsz,wght.ttf

  assets:
    - asset/lotties/

  uses-material-design: true