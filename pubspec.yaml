name: expensetrackerapp
description: "A Expense Tracker App using Flutter."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.6.0
dependencies:
  flutter_bloc: ^8.1.6
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  lottie: ^3.3.1
  device_info_plus: ^11.3.0
  flutter_secure_storage: ^10.3.1
  jwt_decoder: ^2.0.1
  flutter_launcher_icons: ^0.14.4
  dio: ^5.11.0
  intl: ^0.20.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "asset/logo/ExpenzoLogo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#174944"
  adaptive_icon_foreground: "asset/logo/ExpenzoLogo_foreground.png"

flutter:
  fonts:
    - family: Inter
      fonts:
        - asset: asset/fonts/Inter/Inter-VariableFont_opsz,wght.ttf

  assets:
    - asset/lotties/

  uses-material-design: true